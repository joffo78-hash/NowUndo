<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>nowundo</title>
<script src="/main.js"></script>
<style>
:root {
  --bg: #0c0c0f;
  --panel: #16161a;
  --border: #2a2a30;
  --text: #eee;
  --muted: #888;
  --accent: #3d9eff;
  --hold-on: #2ecc71;
  --safe: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  overflow: hidden; touch-action: manipulation; user-select: none;
}
#app { display: flex; flex-direction: column; height: 100%; max-width: 900px; margin: 0 auto; }

/* ── Tabs ── */
#tabs {
  display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 8px 0;
  background: var(--panel); border-bottom: 1px solid var(--border);
  flex-shrink: 0; overflow-x: auto;
}
.tab {
  border: none; background: transparent; color: var(--muted);
  padding: 8px 12px; font-size: 12px; font-weight: 600;
  border-radius: 6px 6px 0 0; cursor: pointer; white-space: nowrap;
}
.tab:hover { color: var(--text); background: #1e1e24; }
.tab.active { color: #fff; background: var(--bg); border: 1px solid var(--border); border-bottom-color: var(--bg); }
.tab.sub { font-size: 11px; padding: 6px 10px; }

#views { flex: 1; min-height: 0; position: relative; }
.view { display: none; height: 100%; overflow: auto; padding: 8px; padding-bottom: calc(8px + var(--safe)); }
.view.active { display: flex; flex-direction: column; }

/* ── Launchpad (embedded styles) ── */
#lp-toolbar { display: flex; align-items: center; gap: 8px; padding: 4px 0 8px; flex-shrink: 0; }
#lp-status { flex: 1; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn {
  border: none; border-radius: 6px; padding: 8px 12px; font-size: 12px; font-weight: 600;
  cursor: pointer; background: #2a2a2a; color: var(--text);
}
.btn:active { transform: scale(0.96); }
.btn.on { background: var(--hold-on); color: #111; }
.btn.layer { background: #333; min-width: 100px; text-align: left; }
.btn.layer::after { content: " ▾"; opacity: .6; }
#conn { width: 10px; height: 10px; border-radius: 50%; background: #555; flex-shrink: 0; }
#conn.ok { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
#conn.warn { background: #f1c40f; }
#lp-grid-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
#lp-grid {
  display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr);
  gap: 3px; width: 100%; max-width: min(100%, calc(100vh - 160px)); aspect-ratio: 1;
}
.pad {
  border-radius: 6px; background: #222; display: flex; align-items: center; justify-content: center;
  overflow: hidden; cursor: pointer; position: relative;
}
.pad.down { filter: brightness(1.35); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
.pad-label {
  font-size: 9px; line-height: 1.15; text-align: center; padding: 2px; pointer-events: none;
  word-break: break-word; max-width: 100%; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
}
.pad.light .pad-label { color: #111; }
.pad.dark .pad-label { color: #f5f5f5; }
#lp-help { font-size: 11px; color: var(--muted); text-align: center; min-height: 16px; padding-top: 4px; }
#layer-menu {
  display: none; position: absolute; z-index: 100; background: #2a2a2a; border: 1px solid #444;
  border-radius: 8px; padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.5); min-width: 140px;
}
#layer-menu button {
  display: block; width: 100%; text-align: left; background: transparent; border: none;
  color: var(--text); padding: 10px 14px; font-size: 13px; border-radius: 4px; cursor: pointer;
}
#layer-menu button:hover, #layer-menu button.active { background: #3d9eff; color: #fff; }

/* ── Twister ── */
#tw-bar {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 4px 0 10px; flex-shrink: 0;
}
#tw-bar .pg {
  border: none; border-radius: 6px; padding: 8px 10px; font-size: 11px; font-weight: 600;
  background: #252530; color: var(--muted); cursor: pointer;
}
#tw-bar .pg.active { background: var(--accent); color: #fff; }
#tw-bar .reset-btn { background: #5a2020; color: #fcc; margin-left: auto; }
#tw-bar .reset-btn:active { background: #a03030; }
#tw-conn { width: 8px; height: 8px; border-radius: 50%; background: #555; }
#tw-conn.ok { background: #2ecc71; }

#tw-page { flex: 1; min-height: 0; overflow: auto; }
.tw-faders { display: flex; flex-direction: column; gap: 10px; padding: 4px 0; }
.tw-row {
  display: grid; grid-template-columns: 56px 1fr 48px; gap: 8px; align-items: center;
  padding: 8px 10px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border);
}
.tw-row.off { opacity: 0.35; }
.tw-name { font-size: 12px; font-weight: 700; }
.tw-pct { font-size: 11px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

/* Dual range track */
.range {
  position: relative; height: 36px; border-radius: 8px; background: #0a0a0c;
  border: 1px solid #333; touch-action: none; cursor: pointer;
}
.range-fill {
  position: absolute; top: 4px; bottom: 4px; border-radius: 6px; opacity: 0.85;
  pointer-events: none;
}
.range-thumb {
  position: absolute; top: 2px; width: 16px; height: 32px; margin-left: -8px;
  border-radius: 4px; background: #fff; border: 2px solid #111;
  box-shadow: 0 1px 4px rgba(0,0,0,.5); pointer-events: none; z-index: 2;
}
.range-thumb.mid {
  width: 20px; margin-left: -10px; height: 20px; top: 8px; border-radius: 50%;
  background: rgba(255,255,255,.9); opacity: 0.95;
}

/* Twister : grille de knobs (pages autres que In/Out) */
.tw-knobs {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  width: 100%; max-width: min(100%, calc(100vh - 170px)); margin: 0 auto; padding: 4px 0;
}
.tw-knob {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; padding: 6px 4px 8px;
  touch-action: none; cursor: ns-resize; position: relative;
}
.tw-knob.empty { opacity: .25; cursor: default; }
.tw-knob.dim { opacity: .38; }
.tw-knob.ro { cursor: default; }
.tw-knob.active { box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
.tw-knob .kl { font-size: 11px; font-weight: 700; height: 14px; overflow: hidden; white-space: nowrap; max-width: 100%; text-overflow: ellipsis; }
.tw-knob svg { width: 100%; max-width: 92px; aspect-ratio: 1; display: block; }
.tw-knob .kv { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; height: 14px; white-space: nowrap; }
/* Boutons de page : Slicer / Cloud on-off, effets */
.tw-extra { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 0 0 10px; }
.tw-xbtn {
  border: 2px solid #333; border-radius: 10px; padding: 10px 16px; min-width: 120px;
  font-size: 13px; font-weight: 800; letter-spacing: .5px; background: #1b1b21; color: #888; cursor: pointer;
}
.tw-xbtn.on { color: #111; }
.tw-xbtn.absent { opacity: .3; cursor: default; }
.tw-xbtn small { display: block; font-size: 10px; font-weight: 600; letter-spacing: 0; margin-top: 2px; opacity: .85; }
/* ── Vue Looper ── */
/* Navigation commune : 8 pages Twister + 8 loopers, toujours visibles */
#nav2 { flex-shrink: 0; padding: 6px 10px 0; }
#nav-tw { display: flex; gap: 4px; padding-bottom: 4px; }
#nav-tw button {
  flex: 1; border: none; border-radius: 6px; padding: 7px 0; font-size: 10px; font-weight: 700;
  background: #252530; color: var(--muted); cursor: pointer; white-space: nowrap; overflow: hidden;
}
#nav-tw button.cur { background: #3a3a48; color: #fff; }
#nav-tw button.sel { background: var(--accent); color: #fff; }
#tw-bar .pg { display: none !important; }
.lv-btns.b8 { grid-template-columns: repeat(8, 1fr); gap: 4px; margin-bottom: 4px; }
.lv-btns.b8 .lv-btn { font-size: 9px; padding: 4px 1px; min-height: 44px; line-height: 1.15; letter-spacing: 0; }
#lv-sel { display: flex; gap: 4px; padding: 2px 0 8px; flex-shrink: 0; }
#lv-sel button {
  flex: 1; border: 2px solid transparent; border-radius: 8px; padding: 8px 0; font-size: 12px; font-weight: 800;
  color: #fff; cursor: pointer; opacity: .55;
}
#lv-sel button.sel { opacity: 1; border-color: #fff; }
#lv-sel.away button.sel { border-color: transparent; }
#lv-sel button.dead { opacity: .18; }
#lv-head { display: flex; align-items: baseline; gap: 10px; padding: 0 2px 6px; flex-shrink: 0; }
#lv-title { font-size: 16px; font-weight: 800; }
#lv-state { font-size: 13px; font-weight: 800; padding: 2px 8px; border-radius: 5px; background: #222; }
#lv-io { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
#lv-wave { width: 100%; height: 34vh; min-height: 150px; border-radius: 10px; background: #08080a; border: 1px solid #2a2a30; touch-action: none; display: block; flex-shrink: 0; }
.lv-vu { display: grid; grid-template-columns: 30px 1fr; gap: 4px 8px; align-items: center; padding: 8px 2px 4px; flex-shrink: 0; font-size: 10px; color: var(--muted); }
.lv-vu .bar { height: 6px; border-radius: 3px; background: #1a1a1f; overflow: hidden; }
.lv-vu .bar div { height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, #2ecc71 0%, #2ecc71 62%, #f1c40f 80%, #e74c3c 100%); background-size: 100vw 100%; }
.lv-grp { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 1px; padding: 8px 2px 4px; }
.lv-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.lv-btn {
  border: 1px solid #333; border-radius: 8px; padding: 11px 2px; font-size: 11px; font-weight: 800;
  background: #1b1b21; color: #aaa; cursor: pointer; letter-spacing: .3px;
}
.lv-btn:active { transform: scale(.96); }
.lv-btn.on { color: #111; }
.lv-sl { display: grid; grid-template-columns: 86px 1fr 46px; gap: 8px; align-items: center; padding: 6px 2px; font-size: 12px; font-weight: 700; }
.lv-sl input { width: 100%; accent-color: #e74c3c; }
.lv-sl span { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; }
.tw-placeholder {
  flex: 1; display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 14px; text-align: center; padding: 24px;
}

/* Dashboard / Looper placeholders */
.dash-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
}
@media (min-width: 600px) { .dash-grid { grid-template-columns: repeat(4, 1fr); } }
.dash-card {
  border-radius: 10px; padding: 12px; min-height: 100px; border: 1px solid rgba(255,255,255,.12);
  display: flex; flex-direction: column; gap: 6px;
}
.dash-card h3 { font-size: 13px; font-weight: 700; }
.dash-card .meta { font-size: 11px; opacity: 0.8; }

#offline {
  display: none; position: absolute; inset: 0; background: rgba(0,0,0,.75); z-index: 50;
  align-items: center; justify-content: center; flex-direction: column; gap: 12px;
  text-align: center; padding: 24px;
}
#offline.show { display: flex; }
</style>
</head>
<body>
<div id="app">
  <nav id="tabs">
    <button class="tab active" data-view="launchpad">Launchpad</button>
    <button class="tab" data-view="twister">Twister</button>
    <button class="tab" data-view="loopers">Loopers</button>
    <span style="margin-left:auto;align-self:center;font-size:10px;color:#6c9;padding:0 8px">web v4.0</span>
  </nav>
  <div id="nav2"><div id="nav-tw"></div><div id="lv-sel"></div></div>

  <div id="views">
    <!-- LAUNCHPAD -->
    <section class="view active" id="view-launchpad">
      <div id="lp-toolbar">
        <div id="conn" title="Backend Launchpad"></div>
        <div id="lp-status">En attente du backend Launchpad…</div>
        <button class="btn layer" id="btn-layer" style="display:none">Layer</button>
        <button class="btn" id="btn-hold">HOLD</button>
      </div>
      <div id="lp-grid-wrap"><div id="lp-grid"></div></div>
      <div id="lp-help"></div>
    </section>

    <!-- TWISTER -->
    <section class="view" id="view-twister">
      <div id="tw-bar">
        <div id="tw-conn" title="Backend Twister"></div>
        <!-- numeros = boutons de page du Launchpad / Twister v3.3+ (1 Volume, 3 In/Out) -->
        <button class="pg" data-page="1">1 Volume</button>
        <button class="pg" data-page="2">2 Pitch</button>
        <button class="pg active" data-page="3">3 In/Out</button>
        <button class="pg" data-page="4">4 Slicer</button>
        <button class="pg" data-page="5">5 Cloud</button>
        <button class="pg" data-page="6">6 Effets</button>
        <button class="pg" data-page="7">7 Custom</button>
        <button class="pg" data-page="8">8 Display</button>
        <button class="btn reset-btn" id="tw-reset">RESET</button>
        <span id="tw-diag" style="font-size:10px;color:#777;width:100%"></span>
      </div>
      <div id="tw-page">
        <div class="tw-faders" id="tw-faders"></div>
        <div class="tw-extra" id="tw-extra" style="display:none"></div>
        <div class="tw-knobs" id="tw-knobs" style="display:none"></div>
        <div class="tw-placeholder" id="tw-placeholder" style="display:none">
          Page Twister à venir — pilotée aussi depuis le Launchpad (fighter page).
        </div>
      </div>
    </section>

    <!-- LOOPERS -->
    <section class="view" id="view-loopers">
      <div id="lv-diag" style="font-size:11px;font-weight:700;padding:0 2px 6px;color:#f39c12">en attente des données du bridge…</div>
      <div id="lv-head"><span id="lv-title">L1</span><span id="lv-state">STOP</span><span id="lv-io"></span></div>
      <canvas id="lv-wave"></canvas>
      <div class="lv-vu"><span>IN</span><div class="bar"><div id="lv-vi"></div></div><span>OUT</span><div class="bar"><div id="lv-vo"></div></div></div>
      <div class="lv-grp">LECTURE / REC (comme les 2 rangées du bas du Launchpad)</div>
      <div class="lv-btns b8" id="lv-tr"></div>
      <div class="lv-btns b8" id="lv-rec"></div>
      <div class="lv-grp">MODES</div>
      <div class="lv-btns" id="lv-mod"></div>
      <div class="lv-grp">SORTIE</div>
      <div id="lv-sls"></div>
    </section>
  </div>
</div>
<div id="layer-menu"></div>

<script>
(function () {
  "use strict";

  // Couleurs loopers (dashboard photo, haut-gauche → bas-droite)
  const LOOPER_COL = [
    "#8B1A1A", // L1 rouge
    "#8B4513", // L2 brun
    "#6B7C23", // L3 olive
    "#1B7A2E", // L4 vert
    "#0A7A7A", // L5 teal
    "#1A3A8B", // L6 bleu
    "#5A1A8B", // L7 violet
    "#8B1A6B"  // L8 magenta
  ];

  // ═══════════════════════════════════════════
  // NAVIGATION ONGLETS
  // ═══════════════════════════════════════════
  const tabs = document.querySelectorAll(".tab");
  const views = document.querySelectorAll(".view");
  function showView(id) {
    tabs.forEach(t => t.classList.toggle("active", t.dataset.view === id));
    views.forEach(v => v.classList.toggle("active", v.id === "view-" + id));
    if (navReady) navRender();
  }
  tabs.forEach(t => t.addEventListener("click", () => showView(t.dataset.view)));

  // ═══════════════════════════════════════════
  // LAUNCHPAD (même logique qu'avant)
  // ═══════════════════════════════════════════
  const SECTION = "nowundo_vl";
  const BLINK_HZ = 2;
  const POLL_MS = 50;
  const OFFLINE_MS = 2500;
  const STATE_FROM_CODE = {
    o: "off", i: "idle", n: "on", w: "warn",
    a: "armed", x: "armed_other", c: "cursor", m: "member_cursor"
  };
  const LEVEL = {
    off: 0, idle: 0.45, on: 1, warn: 1, cursor: 1,
    armed: 1, armed_other: 0.8, member_cursor: 1
  };
  const BLINK = {
    armed: [1, 0], armed_other: [0.8, 0.45], member_cursor: [1, 0.45]
  };

  let pads = {};
  let meta = { page: 1, layer: "fx", layers: [] };
  let holdOn = false, lastTick = 0, backendOk = false, phase = true;
  let downPads = new Set(), lastDragKey = null;

  const grid = document.getElementById("lp-grid");
  const statusEl = document.getElementById("lp-status");
  const helpEl = document.getElementById("lp-help");
  const connEl = document.getElementById("conn");
  const btnHold = document.getElementById("btn-hold");
  const btnLayer = document.getElementById("btn-layer");
  const layerMenu = document.getElementById("layer-menu");

  for (let row = 0; row <= 8; row++) {
    for (let col = 1; col <= 9; col++) {
      const key = row + "," + col;
      const el = document.createElement("div");
      el.className = "pad dark";
      el.dataset.key = key; el.dataset.row = row; el.dataset.col = col;
      const lab = document.createElement("div");
      lab.className = "pad-label";
      el.appendChild(lab);
      grid.appendChild(el);
      pads[key] = { el, lab, hex: 0x222222, state: "off", label: "" };
    }
  }

  function hexToRgb(h) { return [(h >> 16) & 255, (h >> 8) & 255, h & 255]; }
  function luminance(r, g, b) { return (0.299 * r + 0.587 * g + 0.114 * b) / 255; }
  function applyPad(p) {
    let level = LEVEL[p.state] ?? 0;
    const bl = BLINK[p.state];
    if (bl) level = phase ? bl[0] : bl[1];
    const [r, g, b] = hexToRgb(p.hex);
    const R = Math.round(r * level), G = Math.round(g * level), B = Math.round(b * level);
    p.el.style.background = "rgb(" + R + "," + G + "," + B + ")";
    const lum = luminance(R, G, B);
    p.el.classList.toggle("light", lum > 0.5);
    p.el.classList.toggle("dark", lum <= 0.5);
  }
  function parseFrame(str) {
    if (!str) return;
    str.split("|").forEach(function (part) {
      var bits = part.split(":");
      var p = pads[bits[0]]; if (!p) return;
      var hex = parseInt(bits[1], 16) || 0;
      var state = STATE_FROM_CODE[bits[2]] || "off";
      if (p.hex !== hex || p.state !== state) { p.hex = hex; p.state = state; applyPad(p); }
    });
  }
  function parseLabels(str) {
    if (!str) return;
    for (var k in pads) { pads[k].label = ""; pads[k].lab.textContent = ""; }
    str.split("|").forEach(function (part) {
      var idx = part.indexOf(":"); if (idx < 0) return;
      var key = part.slice(0, idx);
      var lab = part.slice(idx + 1).replace(/¦/g, "|").replace(/⁚/g, ":");
      if (pads[key]) { pads[key].label = lab; pads[key].lab.textContent = lab; }
    });
  }
  function parseMeta(str) {
    if (!str) return;
    var m = {};
    str.split(";").forEach(function (pair) { var kv = pair.split("="); if (kv[0]) m[kv[0]] = kv[1]; });
    var np = parseInt(m.page) || 1;
    if (np !== meta.page) {   // la page change sans arret : deux scripts Launchpad publient chacun la leur
      var tnow = Date.now();
      pageFlips = pageFlips.filter(function (x) { return tnow - x < 3000; }); pageFlips.push(tnow);
      if (pageFlips.length >= 5) dualUntil = tnow + 6000;
    }
    meta.page = np;
    meta.layer = m.layer || "fx";
    meta.holdGroup = parseInt(m.hold) || 0;
    if (m.layers) {
      meta.layers = m.layers.split(",").map(function (s) {
        var p = s.split("="); return { id: p[0], name: p[1] || p[0] };
      });
    }
    btnLayer.style.display = meta.page === 4 ? "" : "none";
    if (meta.page === 4) {
      var cur = meta.layers.find(function (l) { return l.id === meta.layer; });
      btnLayer.textContent = "Layer: " + (cur ? cur.name : meta.layer);
    }
    updateHelp();
  }
  function updateHelp() {
    helpEl.textContent = holdOn
      ? (meta.holdGroup > 0 ? "EDIT GROUP " + meta.holdGroup : "HOLD : tapez un pad GROUP")
      : "";
  }

  // Commandes Launchpad numerotees : web_cmd est une seule case (ecrasee a chaque envoi). On renvoie toutes les
  // commandes non acquittees (web_ack) -> un appui n'est plus perdu si le Launchpad lit moins vite qu'on n'ecrit.
  // Compatibilite : si le Launchpad qui tourne est une ancienne version (aucun accuse web_ack), on repasse
  // a l'ancien format (commandes en clair) ; une sonde reguliere detecte le passage a la nouvelle version.
  var CMD_SID = Math.random().toString(36).slice(2, 8), cmdSeq = 0, cmdPend = [], cmdSentAt = 0, cmdDirty = false;
  var cmdAckSeen = false, cmdLegacy = false, cmdProbeAt = 0;
  function flushCmdQueue() {
    var now = Date.now();
    if (!cmdAckSeen && cmdPend.length && now - cmdPend[0][2] > 1200) cmdLegacy = true;
    if (cmdLegacy) {
      if (cmdPend.length) {
        if (now - cmdSentAt < 70) return;     // tout ce qui attend part en un seul envoi, espace de 70 ms
        cmdSentAt = now;
        wwr_req("SET/EXTSTATE/" + SECTION + "/web_cmd/" + encodeURIComponent(cmdPend.splice(0, 16).map(function (c) { return c[1]; }).join(";")));
      } else if (now - cmdProbeAt > 3000 && now - cmdSentAt > 300) {
        cmdProbeAt = now;

  // Interaction dual-thumb
  let drag = null; // { idx, mode: 'in'|'out'|'mid', startX, startIn, startOut, width }

  function hitMode(el, clientX) {
    const rect = el.range.getBoundingClientRect();
    const x = (clientX - rect.left) / rect.width;
    const st = twState[el.range.dataset.idx | 0];
    const dIn = Math.abs(x - st.inN);
    const dOut = Math.abs(x - st.outN);
    const mid = (st.inN + st.outN) / 2;
    const dMid = Math.abs(x - mid);
    const thresh = 0.08;
    // priorité au plus proche
    if (dIn <= dOut && dIn <= dMid && dIn < thresh) return "in";
    if (dOut <= dIn && dOut <= dMid && dOut < thresh) return "out";
    if (dMid < 0.12 && x > Math.min(st.inN, st.outN) && x < Math.max(st.inN, st.outN)) return "mid";
    // clic hors zone : déplacer le bord le plus proche
    return dIn <= dOut ? "in" : "out";
  }

        b = Math.max(a, Math.min(1, drag.startOut + dx));
      } else {
        // mid : translater le segment

        a = drag.startIn + dx;

  // ── Twister : pages en knobs (publiees par le script Twister : nowundo_tw/tw_knobs) ──

  function arcPath(n) {

    const a0 = -225 * Math.PI / 180, a1 = a0 + Math.max(0.0001, n) * 1.5 * Math.PI;
    const r = 38, cx = 50, cy = 50;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    return "M" + x0.toFixed(2) + " " + y0.toFixed(2) + " A" + r + " " + r + " 0 " + ((a1 - a0) > Math.PI ? 1 : 0) + " 1 " + x1.toFixed(2) + " " + y1.toFixed(2);
  }

      '<path class="arc" d="" fill="none" stroke="#888" stroke-width="9" stroke-linecap="round"/>' +
      '<circle cx="50" cy="50" r="26" fill="#1c1c22" stroke="#333" stroke-width="1.5"/>' +

  const NAV_TW = ["1 Vol", "2 Pitch", "3 In/Out", "4 Slicer", "5 Cloud", "6 FX", "7 Cust", "8 Disp"];
  const navTw = document.getElementById("nav-tw");
  NAV_TW.forEach(function (lab, k) {
    const b = document.createElement("button");
    b.textContent = lab;
    b.addEventListener("click", function () { showView("twister"); showTwPage(k + 1); twCmd("PAGE," + (k + 1)); navRender(); });
    navTw.appendChild(b);
  });
  var navReady = true;
  function navRender() {
    const v = document.querySelector(".tab.active"), view = v ? v.dataset.view : "";
    navTw.querySelectorAll("button").forEach(function (b, k) {
      b.classList.toggle("sel", view === "twister" && twPage === k + 1);
      b.classList.toggle("cur", view !== "twister" && twPage === k + 1);
    });
    lvSelEl.classList.toggle("away", view !== "loopers");
    lvSelEl.querySelectorAll("button").forEach(function (b, i) {
      b.classList.toggle("sel", i === lvSel); b.classList.toggle("dead", !lv[i].alive);
    });
  }
  // Rangees B et A du Launchpad (page 1), memes positions et couleurs. {a: action} passe par le Launchpad
  // (meme logique de groupe que le pad, et etats du Launchpad tenus a jour) ; {c: n} = commande directe au JSFX.
  const LV_TR = [["FULL LOOP", { a: "full_loop" }, l => l.len > 0 && l.inN <= 0.001 && l.outN >= 0.999, "#DDDDDD"],
                 ["QUANTISE", { a: "quantise_inout" }, null, "#99FF66"], ["RESTART", { a: "restart" }, null, "#CCCCCC"],
                 ["REVERSE", { a: "reverse" }, l => l.fl & 1, "#FFD320"], ["CLOUD", { a: "cloud" }, l => l.fl & 8, "#66CCFF"],
                 ["SLICER", { a: "slicer" }, l => l.fl & 4, "#FFD320"], ["REDO", { a: "redo" }, null, "#CCCCCC"],
                 ["UNDO", { a: "undo" }, null, "#CCCCCC"]];
  const LV_REC = [["CLEAR", { a: "clear" }, null, "#CCCCCC"], ["RESET", { a: "reset" }, null, "#FF8040"],
                  ["ONE SHOT", { a: "one_shot" }, l => l.fl & 32, "#CCCCCC"], ["STOP / PLAY", { a: "stop_play" }, l => l.st >= 2 && l.st <= 6, "#009933"],
                  ["MULTIPLY", { a: "multiply" }, l => l.st === 6, "#9933FF"], ["REPLACE", { a: "replace" }, l => l.st === 4, "#FF3300"],
                  ["RE-REC", { a: "rerec" }, null, "#FF3333"], ["REC / DUB", { a: "rec_overdub" }, l => l.st === 1 || l.st === 3 || l.st === 8, "#FF0000"]];
  const LV_MOD = [["PING-PONG", { a: "auto_rev" }, l => l.fl & 2, "#FFD320"], ["AUTO REC", { a: "auto" }, l => (l.fl & 64) || l.st === 7, "#9999FF"],
                  ["AUTO-REP", { c: 10 }, l => l.st === 5, "#d6b07a"], ["BEAT REPEAT", { c: 33 }, l => l.fl & 16, "#52C78C"]];
  function lvSend(x) {
    if (x.a) queueCmd("ACT," + (lvSel + 1) + "," + x.a);
    else lvQ.push("CMD," + lvSel + "," + x.c);
  }
  function lvButtons(el, defs) {
    defs.forEach(function (d) {
      const b = document.createElement("button");
      b.className = "lv-btn"; b.textContent = d[0];
      b.addEventListener("click", function () { lvSend(d[1]); });
      el.appendChild(b); d.el = b; d.col = d[3];
    });
  }
  lvButtons(document.getElementById("lv-tr"), LV_TR);
  lvButtons(document.getElementById("lv-rec"), LV_REC);
  lvButtons(document.getElementById("lv-mod"), LV_MOD);
  // Degradation 0..1 (20) | Output 0..2 (22) | Stereo 0..1 (21)
  const LV_SL = [["Feedback", "fb", 19, 2, v => Math.round(v * 100) + "%"], ["Degradation", "dg", 20, 1, v => Math.round(v * 100) + "%"], ["Output", "ov", 22, 2, v => Math.round(v * 100) + "%"],
                 ["Stereo", "sw", 21, 1, v => Math.round(v * 100) + "%"]];
  const lvSls = document.getElementById("lv-sls");
  const lvPend = {};
  LV_SL.forEach(function (d) {
    const row = document.createElement("div"); row.className = "lv-sl";
    row.innerHTML = "<label>" + d[0] + '</label><input type="range" min="0" max="' + d[3] + '" step="0.01"><span></span>';
    lvSls.appendChild(row);
    d.inp = row.querySelector("input"); d.val = row.querySelector("span");
    d.inp.addEventListener("input", function () {
      const v = parseFloat(d.inp.value); lv[lvSel][d[1]] = v; lvHold[d[1]] = Date.now();
      d.val.textContent = d[4](v); lvPend["PAR," + lvSel + "," + d[2]] = v;
    });
  });
  // Envoi groupe : web_cmd est un seul emplacement (ecrase a chaque SET), et cote JSFX la commande (+48)
  // et le reglage (+180) sont aussi des emplacements uniques -> par envoi : 1 commande, 1 reglage, le dernier In/Out.
  const lvQ = [];
  setInterval(function () {
    const out = [];
    if (lvQ.length) out.push(lvQ.shift());
    const k = Object.keys(lvPend)[0];
    if (k !== undefined) { out.push(k + "," + lvPend[k].toFixed(3)); delete lvPend[k]; }
    if (ioPend) { out.push(ioPend); ioPend = null; }
    if (out.length) twCmd(out.join(";"));
  }, 70);

  // Forme d'onde + In / Out au doigt : poignee In, poignee Out, ou deplacement de toute la fenetre
  const cv = document.getElementById("lv-wave");
  const cx = cv.getContext("2d");
  let ioDrag = null, ioPend = null;
  function cvX(e) { const r = cv.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); }
  cv.addEventListener("pointerdown", function (e) {
    const l = lv[lvSel]; if (!l.alive || l.len <= 0) return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    const x = cvX(e), dIn = Math.abs(x - l.inN), dOut = Math.abs(x - l.outN);
    let mode = (dIn < 0.05 && dIn <= dOut) ? "in" : (dOut < 0.05 ? "out" : ((x > l.inN && x < l.outN) ? "mid" : (dIn <= dOut ? "in" : "out")));
    ioDrag = { mode: mode, x0: x, in0: l.inN, out0: l.outN };
    if (mode !== "mid") lvMove(e);
  });
  function lvMove(e) {
    if (!ioDrag) return;
    const l = lv[lvSel], x = cvX(e);
    let a = ioDrag.in0, b = ioDrag.out0;
    if (ioDrag.mode === "in") a = Math.min(x, b - 0.005);
    else if (ioDrag.mode === "out") b = Math.max(x, a + 0.005);
    else { const w = b - a; a = Math.max(0, Math.min(1 - w, ioDrag.in0 + x - ioDrag.x0)); b = a + w; }
    l.inN = Math.max(0, a); l.outN = Math.min(1, b); lvHold.io = Date.now();
    ioPend = "IO," + lvSel + "," + l.inN.toFixed(4) + "," + l.outN.toFixed(4);
    lvDraw();
  }
  cv.addEventListener("pointermove", lvMove);
  cv.addEventListener("pointerup", function () { ioDrag = null; });
  cv.addEventListener("pointercancel", function () { ioDrag = null; });
  cv.addEventListener("dblclick", function () { lvSend({ a: "full_loop" }); });   // double clic = boucle complete

  function lvDraw() {
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.clearRect(0, 0, W, H);
    const l = lv[lvSel], col = LOOPER_COL[lvSel];
    const st = LV_STATE[l.st] || LV_STATE[0];
    const playing = l.st >= 2 && l.st <= 6;
    const n = l.wave.length || 0, mid = H / 2;
    if (n) {
      const bw = W / n;
      for (let k = 0; k < n; k++) {
        const x = k * bw, inside = (k + 0.5) / n >= l.inN && (k + 0.5) / n <= l.outN;
        const h = Math.max(1, l.wave[k] * H * 0.46);
        cx.fillStyle = inside ? (playing ? "#2ecc71" : st[1]) : "#3a3a42";
        if (!inside) cx.globalAlpha = 0.6;
        cx.fillRect(x + bw * 0.15, mid - h, bw * 0.7, h * 2);
        cx.globalAlpha = 1;
      }
    } else {
      cx.fillStyle = "#555"; cx.font = "13px sans-serif"; cx.textAlign = "center";
      cx.fillText(l.alive ? "boucle vide" : "looper absent", W / 2, mid);
    }
    if (l.len > 0) {
      cx.fillStyle = "rgba(0,0,0,.45)";
      cx.fillRect(0, 0, l.inN * W, H); cx.fillRect(l.outN * W, 0, W - l.outN * W, H);
      [[l.inN, "#52f08a", "IN"], [l.outN, "#9dffbe", "OUT"]].forEach(function (h) {
        const x = h[0] * W;
        cx.fillStyle = h[1]; cx.fillRect(x - 1.5, 0, 3, H);
        cx.beginPath(); cx.moveTo(x - 9, 0); cx.lineTo(x + 9, 0); cx.lineTo(x, 12); cx.closePath(); cx.fill();
        cx.beginPath(); cx.moveTo(x - 9, H); cx.lineTo(x + 9, H); cx.lineTo(x, H - 12); cx.closePath(); cx.fill();
      });
      const px = Math.max(0, Math.min(100, l.pos)) / 100 * W;
      cx.fillStyle = "#ff8fd6"; cx.fillRect(px - 1, 0, 2, H);
    }
    cx.strokeStyle = col; cx.lineWidth = 3; cx.strokeRect(1.5, 1.5, W - 3, H - 3);
  }
  function lvRender(force) {
    const l = lv[lvSel], st = LV_STATE[l.st] || LV_STATE[0];
    navRender();
    document.getElementById("lv-title").textContent = "L" + (lvSel + 1) + " · " + (LV_PART[l.part] || "MAIN");
    const se = document.getElementById("lv-state");
    se.textContent = l.alive ? st[0] : "ABSENT"; se.style.background = l.alive ? st[1] : "#222"; se.style.color = (l.st === 0 || !l.alive) ? "#ddd" : "#111";
    document.getElementById("lv-io").textContent = l.len > 0 ? "In " + Math.round(l.inN * 100) + "%  ·  Out " + Math.round(l.outN * 100) + "%" : "";
    const vu = function (v) { const db = 20 * Math.log10(Math.max(v, 1e-5)); return Math.max(0, Math.min(100, (db + 48) / 48 * 100)) + "%"; };
    document.getElementById("lv-vi").style.width = vu(l.vi);
    document.getElementById("lv-vo").style.width = vu(l.vo);
    [LV_TR, LV_REC, LV_MOD].forEach(function (defs) {
      defs.forEach(function (d) {
        const on = d[2] ? !!d[2](l) : false;
        d.el.classList.toggle("on", on);   // comme une LED du Launchpad : couleur pleine si actif, attenuee sinon
        d.el.style.background = on ? d.col : d.col + "26"; d.el.style.borderColor = on ? d.col : d.col + "59";
        d.el.style.color = on ? "#111" : d.col;
      });
    });
    LV_SL.forEach(function (d) {
      if (force || Date.now() - lvHold[d[1]] > 400) { d.inp.value = l[d[1]]; d.val.textContent = d[4](l[d[1]]); }
    });
    lvDraw();
  }
  let lvLast = 0;
  setInterval(function () {
    const el = document.getElementById("lv-diag");
    if (cmdLegacy) { el.style.color = "#f39c12"; el.textContent = "web v4.0 · Launchpad ancienne version : remplacez virtuallaunchpad_main.lua et relancez-le (boutons ci-dessous inactifs)"; }
    else if (Date.now() - lvLast < 2000) { el.style.color = "#2ecc71"; el.textContent = "web v4.0 · bridge OK (" + lv.filter(l => l.alive).length + " looper(s) détecté(s))"; }
    else { el.style.color = "#f39c12"; el.textContent = "web v4.0 · aucune donnée looper : remplacez et relancez NowUndo_Twister_Web.lua (version Loopers)"; }
  }, 1000);
  function parseLvFast(str) {
    if (!str) return;
    lvLast = Date.now();
    const now = Date.now();
    str.split(";").forEach(function (p) {
      const b = p.split(","); const i = parseInt(b[0], 10); if (!(i >= 0 && i < 8)) return;
      const l = lv[i];
      l.alive = b[1] === "1"; l.st = parseInt(b[2], 10) || 0; l.pos = parseFloat(b[3]) || 0;
      if (!(i === lvSel && (ioDrag || now - lvHold.io < 400))) { l.inN = parseFloat(b[4]) || 0; l.outN = parseFloat(b[5]); if (isNaN(l.outN)) l.outN = 1; }
      l.vi = parseFloat(b[6]) || 0; l.vo = parseFloat(b[7]) || 0; l.fl = parseInt(b[8], 10) || 0;
      if (!(i === lvSel && now - lvHold.dg < 400)) l.dg = parseFloat(b[9]) || 0;
      if (!(i === lvSel && now - lvHold.ov < 400)) l.ov = parseFloat(b[10]) || 0;
      if (!(i === lvSel && now - lvHold.sw < 400)) l.sw = parseFloat(b[11]) || 0;
      l.len = parseFloat(b[12]) || 0; l.part = parseInt(b[13], 10) || 1;
      if (b.length > 14 && !(i === lvSel && now - lvHold.fb < 400)) l.fb = parseFloat(b[14]) || 0;
    });
    if (document.getElementById("view-loopers").classList.contains("active")) lvRender(false); else navRender();
  }
  function parseLvWave(str) {
    if (!str) return;
    str.split("|").forEach(function (w, i) {
      if (i > 7) return;
      const a = [];
      for (let k = 0; k < w.length; k++) a.push(Math.max(0, ALPHA.indexOf(w[k])) / 61);
      lv[i].wave = a;
    });
  }
  window.addEventListener("resize", function () { lvDraw(); });
  tabs.forEach(t => t.addEventListener("click", function () { if (t.dataset.view === "loopers") setTimeout(function () { lvRender(true); }, 0); }));

  // ═══════════════════════════════════════════
  // WWR
  // ═══════════════════════════════════════════
  // Une exception ici bloquerait definitivement la boucle d'envoi de main.js (REAPER) : chaque ligne est protegee.
  function wwr_onreply(results) {
    results.split("\n").forEach(function (line) {
      try { onReplyLine(line); }
      catch (e) { statusEl.textContent = "erreur page : " + (e && e.message); if (window.console) console.error(e); }
    });
  }
  function onReplyLine(line) {
    {
      if (!line) return;
      var tok = line.split("\t");
      if (tok[0] !== "EXTSTATE") return;
      var key = tok[2], val = tok[3] || "";
      if (tok[1] === SECTION || true) {
        if (key === "web_frame") parseFrame(val);
        else if (key === "web_labels") parseLabels(val);
        else if (key === "web_status") statusEl.textContent = val || "—";
        else if (key === "web_meta") parseMeta(val);
        else if (key === "web_ack") onCmdAck(val);
        else if (key === "web_tick") {
          lastTick = Date.now();
          if (!backendOk) { backendOk = true; connEl.className = "ok"; }
        }
      }
      if (key === "tw_state") parseTwState(val);
      else if (key === "tw_knobs") parseTwKnobs(val);
      else if (key === "lv_fast") parseLvFast(val);
      else if (key === "lv_wave") parseLvWave(val);
      else if (key === "tw_extra") { if (val !== twExtra) { twExtra = val; renderTwExtra(); } }
      else if (key === "tw_ktick") { if (val && val !== twKTick) { twKTick = val; twKTickAt = Date.now(); } }
      else if (key === "tw_err") { twErr = val || ""; }
      else if (key === "tw_page") {
        var tp = parseInt(val, 10);
        if (tp >= 1 && tp <= 8 && tp !== twPage) showTwPage(tp);
      }
      else if (key === "tw_tick") {
        twLastTick = Date.now();
        twConn.className = "ok";
      }
    }
  }
  window.wwr_onreply = wwr_onreply;

  setInterval(function () {
    if (Date.now() - lastTick > OFFLINE_MS && backendOk) {
      backendOk = false; connEl.className = "warn";
    }
    if (Date.now() - twLastTick > OFFLINE_MS) twConn.className = "";
  }, 500);

  if (typeof g_wwr_timer_freq !== "undefined") g_wwr_timer_freq = 40;
  wwr_start();
  wwr_req_recur(
    "GET/EXTSTATE/" + SECTION + "/web_frame;" +
    "GET/EXTSTATE/" + SECTION + "/web_status;" +
    "GET/EXTSTATE/" + SECTION + "/web_meta;" +
    "GET/EXTSTATE/" + SECTION + "/web_tick;" +
    "GET/EXTSTATE/" + SECTION + "/web_ack;" +
    "GET/EXTSTATE/" + TW_SECTION + "/tw_state;" +
    "GET/EXTSTATE/" + TW_SECTION + "/tw_page;" +
    "GET/EXTSTATE/" + TW_SECTION + "/tw_knobs;" +
    "GET/EXTSTATE/" + TW_SECTION + "/lv_fast;" +
    "GET/EXTSTATE/" + TW_SECTION + "/tw_extra;" +
    "GET/EXTSTATE/" + TW_SECTION + "/tw_ktick;" +
    "GET/EXTSTATE/" + TW_SECTION + "/tw_err;" +
    "GET/EXTSTATE/" + TW_SECTION + "/tw_tick",
    POLL_MS
  );
  wwr_req_recur("GET/EXTSTATE/" + SECTION + "/web_labels", 300);
  wwr_req_recur("GET/EXTSTATE/" + TW_SECTION + "/lv_wave", 500);
})();
</script>
</body>
